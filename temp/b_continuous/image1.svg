  </g>

  <circle cx="400" cy="281.25" r="5" fill="#333333" />
  <circle cx="380" cy="241.25" r="4" fill="#0055cc" />
  <circle cx="420" cy="321.25" r="4" fill="#0055cc" />

  <text x="412" y="286" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="20" fill="#333333">z</text>

  <text x="220" y="190" font-family="'Times New Roman', Times, serif" font-size="18" fill="#0055cc">
    <tspan font-style="italic">z</tspan><tspan dy="-10" font-size="14">+</tspan><tspan dy="10"> = </tspan><tspan font-style="italic">z</tspan> + ε <tspan font-style="italic" font-weight="bold">n</tspan>(<tspan font-style="italic">z</tspan>)
  </text>

  <text x="430" y="380" font-family="'Times New Roman', Times, serif" font-size="18" fill="#0055cc">
    <tspan font-style="italic">z</tspan><tspan dy="-10" font-size="14">-</tspan><tspan dy="10"> = </tspan><tspan font-style="italic">z</tspan> - ε <tspan font-style="italic" font-weight="bold">n</tspan>(<tspan font-style="italic">z</tspan>)
  </text>

  <text x="360" y="245" font-family="'Times New Roman', Times, serif" font-size="16" fill="#666666" font-style="italic">
    <tspan font-weight="bold">n</tspan>(<tspan>z</tspan>)
  </text>
