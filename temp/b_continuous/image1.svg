<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0055cc" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <line x1="50" y1="225" x2="750" y2="225" stroke="#f0f0f0" stroke-width="2" />
  <line x1="400" y1="50" x2="400" y2="400" stroke="#f0f0f0" stroke-width="2" />
  <text x="730" y="215" font-family="'Times New Roman', Times, serif" font-style="italic" fill="#cccccc" font-size="16">Re</text>
  <text x="410" y="70" font-family="'Times New Roman', Times, serif" font-style="italic" fill="#cccccc" font-size="16">Im</text>

  <path d="M 150 300 C 300 400, 500 200, 650 150" stroke="#cc0000" stroke-width="4" fill="none" marker-end="url(#arrow-red)" />

  <text x="130" y="290" font-family="'Times New Roman', Times, serif" font-weight="bold" font-size="22" fill="#cc0000">Γ</text>
  <text x="440" y="160" font-family="'Times New Roman', Times, serif" font-size="16" fill="#cc0000">
    Branch Cut (Continuous Spectrum, Ω)
  </text>

  <path d="M 170 340 C 320 440, 520 240, 670 190" stroke="#0055cc" stroke-width="2" stroke-dasharray="6,4" fill="none" />
  <g transform="translate(420, 321.25) rotate(-26.56)">
    <polygon points="-8,-5 4,0 -8,5" fill="#0055cc" />
  </g>

  <path d="M 630 110 C 480 160, 280 360, 130 260" stroke="#0055cc" stroke-width="2" stroke-dasharray="6,4" fill="none" />
  <g transform="translate(380, 241.25) rotate(153.43)">
    <polygon points="-8,-5 4,0 -8,5" fill="#0055cc" />
  </g>

  <line x1="130" y1="260" x2="170" y2="340" stroke="#0055cc" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="630" y1="110" x2="670" y2="190" stroke="#0055cc" stroke-width="2" stroke-dasharray="6,4" />

  <line x1="380" y1="241.25" x2="420" y2="321.25" stroke="#666666" stroke-width="1.5" stroke-dasharray="3,3" />
  
  <g transform="translate(390, 261.25) rotate(-116.56)">
